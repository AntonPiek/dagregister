<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dagregister</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#14161a;--panel:#1c1f25;--panel2:#23272f;--line:#2f343d;--text:#e9ebee;--muted:#8d95a3;
  --acc:#ff7a1a;--acc2:#ffb15c;--ok:#3ccf8e;--warn:#ffcc4d;--bad:#ff5d5d;--blue:#5aa9ff;
  --radius:12px;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
:root[data-theme="light"]{
  --bg:#f3f1ec;--panel:#ffffff;--panel2:#f7f5f1;--line:#e2ded6;--text:#1d1f23;--muted:#6b7280;
  --acc:#e2620a;--acc2:#b85a10;--ok:#14935c;--warn:#b98500;--bad:#d23a3a;--blue:#2b74d6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:16px;padding:10px 20px;max-width:1500px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.logo{width:30px;height:30px;border-radius:8px;background:repeating-linear-gradient(135deg,var(--acc) 0 6px,#1a1a1a 6px 12px);box-shadow:inset 0 0 0 2px var(--acc)}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:0}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:600}
nav button:hover{color:var(--text);background:var(--panel2)}
nav button.on{color:var(--text);background:var(--panel2);box-shadow:inset 0 -2px 0 var(--acc)}
nav button.locked{opacity:.35}
.navgrp{align-self:center;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:0 4px 0 6px;opacity:.7}
.navsep{width:1px;background:var(--line);margin:4px 8px}
.topact{align-items:center}
.topact{display:flex;gap:6px}
main{max-width:1500px;margin:0 auto;padding:20px}
.btn{background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1a0d00}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#03200f}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.icon{padding:7px 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
h1{font-size:24px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 12px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:16px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi b{display:block;font-size:26px;font-family:var(--mono);font-weight:700;margin-top:4px}
.kpi span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
input[type=email],input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
label.f>*{color:var(--text);font-weight:400;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}main{padding:14px}.topin{padding:10px 14px;flex-wrap:wrap}}
/* today */
.hero{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.clock{font-family:var(--mono);font-size:56px;font-weight:700;letter-spacing:-1px;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:transform .08s,border-color .15s;min-height:132px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.tile:hover{border-color:var(--muted)}
.tile:active{transform:scale(.98)}
.tile.in{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
.tile.in::after{content:"";position:absolute;top:12px;right:12px;width:10px;height:10px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 70%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.tile.abs{opacity:.7;border-style:dashed}
.who{display:flex;gap:10px;align-items:center}
.av{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-weight:800;color:#111;flex:none;font-size:15px}
.who b{display:block;font-size:16px}
.who small{color:var(--muted)}
.jobchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 8px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.timer{font-family:var(--mono);font-size:22px;font-weight:700}
.tile .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.p-in{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.p-out{background:var(--panel2);color:var(--muted)}
.p-abs{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.p-warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.p-done{background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue)}
/* register */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:var(--panel2);position:sticky;top:0;z-index:1}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono)}
tbody tr:hover td{background:color-mix(in srgb,var(--panel2) 60%,transparent)}
.reg td.c{padding:4px;text-align:center;min-width:78px;position:relative}
.reg th.today,.reg td.today{background:color-mix(in srgb,var(--acc) 8%,transparent)}
.reg th.we,.reg td.we{opacity:.75}
.cell{display:flex;flex-direction:column;align-items:center;gap:3px}
.cell input{width:58px;text-align:center;font-family:var(--mono);font-weight:700;padding:6px 4px;background:transparent;border:1px solid transparent}
.cell input:hover{border-color:var(--line)}
.cell input:focus{background:var(--panel2);border-color:var(--acc)}
.cell.has input{color:var(--text)}
.bars{display:flex;height:4px;width:54px;border-radius:2px;overflow:hidden;background:var(--line)}
.bars i{display:block;height:100%}
.tag{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;text-transform:uppercase;cursor:pointer}
.more{position:absolute;top:2px;right:2px;opacity:0;background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 4px}
td.c:hover .more{opacity:1}
.c-leave{background:color-mix(in srgb,var(--blue) 12%,transparent)}
@media(max-width:1560px){.navgrp{display:none}nav button{padding:8px 9px}.brand small{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
.docs{margin-top:14px;padding:12px;border:1px dashed var(--line);border-radius:10px}
.docrow{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.docrow:last-child{border-bottom:0}
.c-absent{background:color-mix(in srgb,var(--bad) 12%,transparent)}
.namecell{display:flex;gap:8px;align-items:center}
.namecell .av{width:28px;height:28px;font-size:11px;border-radius:8px}
/* jobs */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;position:relative;overflow:hidden}
.card:hover{border-color:var(--muted)}
.card .stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
.prog{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;border-radius:6px}
.code{font-family:var(--mono);font-size:12px;color:var(--muted)}
/* charts */
.hbar{display:grid;grid-template-columns:minmax(90px,200px) 1fr 80px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.hbar .t{height:16px;background:var(--panel2);border-radius:5px;overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:5px}
.hbar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cols{display:flex;align-items:flex-end;gap:3px;height:160px;padding-top:10px}
.cols div{flex:1;background:var(--acc);border-radius:3px 3px 0 0;min-height:1px;position:relative;opacity:.85}
.cols div:hover{opacity:1}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--panel2)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px;overflow:auto;animation:fade .12s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:620px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal.wide{max-width:900px}
.mhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mhead h2{margin:0;font-size:19px}
.x{margin-left:auto;background:none;border:0;font-size:22px;color:var(--muted);cursor:pointer}
.jobpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;max-height:46vh;overflow:auto;padding:2px}
.jobbtn{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.jobbtn:hover{border-color:var(--acc)}
.jobbtn b{display:block;font-size:13px}
.jobbtn small{color:var(--muted);font-size:11px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;padding:5px 10px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.lines .ln{display:grid;grid-template-columns:1fr 90px 34px;gap:8px;margin-bottom:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:99;animation:fade .15s}
.empty{padding:40px;text-align:center;color:var(--muted)}
.banner{background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.sec{margin-top:22px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.money{font-family:var(--mono)}
.lockscreen{text-align:center;padding:60px 20px}
.authbox{max-width:420px;margin:8vh auto;padding:28px}
.sync{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
.sync.saving{background:var(--warn)}.sync.err{background:var(--bad)}
.whobox{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
/* payslip print */
#print{display:none}
.slip{background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;width:180mm;margin:0 auto 10mm;padding:10mm;border:1px solid #ccc;page-break-after:always;font-size:12px}
.slip h3{margin:0;font-size:16px}
.slip table td,.slip table th{border:1px solid #999;padding:5px 7px;color:#111;background:#fff;position:static;font-size:12px;text-transform:none;letter-spacing:0}
.slip .net{font-size:16px;font-weight:700;background:#f2f2f2}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block}
  .slip{border:0;margin:0 auto}
  html,body{background:#fff!important}
  .pr-table{color:#111}
  .pr-table th,.pr-table td{color:#111;background:#fff;border:1px solid #999;font-size:10px;padding:3px 5px}
}
</style>
</head>
<body>
<div class="top"><div class="topin">
  <div class="brand"><div class="logo"></div><div>Dagregister<small id="coName"></small></div></div>
  <nav id="nav"></nav>
  <div class="topact">
    <span class="whobox"><span id="sync" class="sync ok" title="All changes saved"></span><span id="who"></span></span>
    <button class="btn sm" data-act="newjob" title="Add a new job">+ Job</button>
    <button class="btn sm" data-act="newemp" id="qPerson" title="Add a new person">+ Person</button>
    <button class="btn icon ghost" data-act="theme" title="Light / dark">☀︎ / ☾</button>
    <button class="btn icon ghost" data-act="lock" id="lockBtn" title="Lock manager areas">🔓</button>
    <button class="btn sm ghost" data-act="signout">Sign out</button>
  </div>
</div></div>
<main id="app"></main>
<div id="print"></div>

<script>
const KEY='dagregister.v1';
const TABS=[['today','Today'],['register','Week register'],['jobs','Jobs'],['people','People'],['leave','Leave'],['pay','Payroll'],['reports','Reports'],['settings','Settings']];
const LOCKED_TABS=['people','leave','reports','pay','settings'];
const CODES={
  absent:{l:'Absent',c:'var(--bad)',off:1},
  absent_r:{l:'Absent (reason)',c:'#ff8f6b',off:1},
  sick:{l:'Sick',c:'#c78bff',off:1},
  leave:{l:'Leave',c:'var(--blue)',off:1},
  rain:{l:'Rain',c:'#4fc3d9',off:1},
  holiday:{l:'Public holiday',c:'#9aa3b2',off:1},
  late:{l:'Late',c:'var(--warn)'},
  early:{l:'Left early',c:'var(--warn)'},
  note:{l:'Note',c:'var(--muted)'}
};
const PALETTE=['#ff7a1a','#3ccf8e','#5aa9ff','#ffcc4d','#c78bff','#ff5d8f','#4fc3d9','#a3d65c','#ff9f6b','#7f8cff','#e6b07a','#5fd1b0'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const toISO=d=>d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const addDays=(s,n)=>{const d=parse(s);d.setUTCDate(d.getUTCDate()+n);return toISO(d)};
const dow=s=>parse(s).getUTCDay();
const todayISO=()=>{const n=new Date();return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())};
const nowHM=()=>{const n=new Date();return pad(n.getHours())+':'+pad(n.getMinutes())};
const weekStart=s=>addDays(s,-((dow(s)-5+7)%7)); // pay week starts Friday
const weekDays=ws=>[0,1,2,3,4,5,6].map(i=>addDays(ws,i));
function weekNo(ws){const y=+ws.slice(0,4);let f=y+'-01-01';while(dow(f)!==5)f=addDays(f,1);return Math.round((parse(ws)-parse(f))/864e5/7)+1}
const fmtD=s=>{const d=parse(s);return d.getUTCDate()+' '+MON[d.getUTCMonth()]};
const fmtDL=s=>{const d=parse(s);return DOW[d.getUTCDay()]+' '+d.getUTCDate()+' '+MON[d.getUTCMonth()]+' '+d.getUTCFullYear()};
const h2=n=>(Math.round(n*100)/100).toString();
const hm=mins=>{mins=Math.max(0,Math.floor(mins));return Math.floor(mins/60)+'h '+pad(mins%60)+'m'};
const money=n=>(S.settings.cur||'R')+' '+(Math.round(n*100)/100).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});
const toMin=t=>{const[a,b]=t.split(':').map(Number);return a*60+b};
const initials=s=>s.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* ---------- state ---------- */
let S, IDX, UI={tab:'today',week:weekStart(todayISO()),jobFilter:'active',jobQ:'',peopleFilter:'active',range:'thisweek',from:'',to:'',payWeek:weekStart(todayISO()),locked:false};
function defaults(){
  return {v:1,settings:{company:'BOLAND 3D SOLUTIONS (PTY) LTD',address:'22c Krone Street\nWorcester\n6850',cur:'R',
    dayStart:'07:30',dayEnd:'16:30',lunchFrom:'12:30',lunchTo:'13:00',round:15,grace:10,
    std:{0:0,1:8,2:8,3:8,4:8,5:6,6:0},defJob:'j-gen',pin:'',theme:'dark',leave:leaveDefaults()},
    emps:[],jobs:[
      {id:'j-imp',code:'J000',name:'Unallocated (imported from Excel)',client:'',quote:0,status:'done',color:'#8d95a3'},
      {id:'j-gen',code:'J001',name:'Workshop general',client:'Internal',quote:0,status:'active',color:'#5aa9ff'},
      {id:'j-mnt',code:'J002',name:'Cleaning & maintenance',client:'Internal',quote:0,status:'active',color:'#a3d65c'},
      {id:uid(),code:'J101',name:'Example: Carport 6x6m',client:'Example client',quote:120,status:'active',color:'#ff7a1a'}],
    entries:[],notes:{},adv:[],deds:{},clocks:{},leave:[],docs:[]};
}
/* ---------- cloud (Supabase) ---------- */
const SB_URL='https://wdvownwsobsfhpelrlcb.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indkdm93bndzb2JzZmhwZWxybGNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMDA5ODIsImV4cCI6MjEwNzU3Njk4Mn0.ueb0mXdQ1oPu9A1UYi9BqbQa_u8AmLRMilGpFrmEBBQ';
const sb=supabase.createClient(SB_URL,SB_KEY);
let ME=null,PROFILES=[],SNAP=new Map(),pendingRender=false,syncState='ok',flushing=false,flushAgain=false;
const SEP='\u0001';
function canon(v){
  if(Array.isArray(v))return '['+v.map(x=>x===undefined?'null':canon(x)).join(',')+']';
  if(v&&typeof v==='object')return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';
  return JSON.stringify(v===undefined?null:v);
}
function toRecs(s){
  const m=new Map(),put=(k,id,d)=>m.set(k+SEP+id,canon(d));
  s.emps.forEach(x=>put('emp',x.id,x));s.jobs.forEach(x=>put('job',x.id,x));s.entries.forEach(x=>put('entry',x.id,x));
  for(const k in s.notes)put('note',k,s.notes[k]);s.adv.forEach(x=>put('adv',x.id,x));(s.leave||[]).forEach(x=>put('leave',x.id,x));(s.docs||[]).forEach(x=>put('doc',x.id,x));
  for(const k in s.deds)put('ded',k,s.deds[k]);for(const k in s.clocks)put('clock',k,s.clocks[k]);
  put('settings','main',s.settings);return m;
}
function applyRec(s,kind,id,data){ // data null => delete
  if(!s.leave)s.leave=[];if(!s.docs)s.docs=[];const arr={emp:'emps',job:'jobs',entry:'entries',adv:'adv',leave:'leave',doc:'docs'}[kind],map={note:'notes',ded:'deds',clock:'clocks'}[kind];
  if(arr){const i=s[arr].findIndex(x=>x.id===id);if(data===null){if(i>=0)s[arr].splice(i,1)}else if(i>=0)s[arr][i]=data;else s[arr].push(data)}
  else if(map){if(data===null)delete s[map][id];else s[map][id]=data}
  else if(kind==='settings'&&data){s.settings={...defaults().settings,...data};for(const k in PH_CACHE)delete PH_CACHE[k]}
}
function emptyState(){const s=defaults();s.jobs=[];return s}
async function loadData(){
  const rows=[];
  for(let from=0;;from+=1000){
    const{data,error}=await sb.from('records').select('kind,id,data').order('kind').order('id').range(from,from+999);
    if(error)throw error;rows.push(...data);if(data.length<1000)break;
  }
  S=emptyState();SNAP=new Map();
  for(const r of rows){applyRec(S,r.kind,r.id,r.data);SNAP.set(r.kind+SEP+r.id,canon(r.data))}
  if(!rows.some(r=>r.kind==='settings'))S.settings=defaults().settings;
  reindex();return rows.length;
}
function save(){reindex();clearTimeout(save.t);save.t=setTimeout(flush,400);setSync('saving')}
async function flush(){
  if(flushing){flushAgain=true;return}
  flushing=true;
  const cur=toRecs(S),ups=[],dels=[],prev=new Map();
  for(const[k,v]of cur)if(SNAP.get(k)!==v){ups.push(k);prev.set(k,SNAP.get(k));SNAP.set(k,v)}
  for(const k of [...SNAP.keys()])if(!cur.has(k)){dels.push(k);prev.set(k,SNAP.get(k));SNAP.delete(k)}
  let ok=true;
  try{
    for(let i=0;i<ups.length;i+=500){
      const rows=ups.slice(i,i+500).map(k=>{const[kind,id]=k.split(SEP);return{kind,id,data:JSON.parse(cur.get(k))}});
      const{error}=await sb.from('records').upsert(rows);if(error)throw error;
    }
    const byKind={};dels.forEach(k=>{const[kind,id]=k.split(SEP);(byKind[kind]=byKind[kind]||[]).push(id)});
    for(const kind in byKind)for(let i=0;i<byKind[kind].length;i+=200){
      const{error}=await sb.from('records').delete().eq('kind',kind).in('id',byKind[kind].slice(i,i+200));if(error)throw error;
    }
  }catch(e){
    ok=false;console.error(e);
    for(const[k,v]of prev){if(v===undefined)SNAP.delete(k);else SNAP.set(k,v)} // retry next time
    toast('⚠ Not saved – check internet connection. Will retry.');setTimeout(()=>save(),8000);
  }
  flushing=false;setSync(ok?'ok':'err');
  if(flushAgain){flushAgain=false;flush()}
}
function setSync(s){syncState=s;const el=$('#sync');if(el){el.className='sync '+s;el.title={ok:'All changes saved',saving:'Saving…',err:'Not saved – offline?'}[s]}}
window.addEventListener('beforeunload',e=>{if(syncState!=='ok'){e.preventDefault();e.returnValue=''}});
function subscribe(){
  sb.channel('records').on('postgres_changes',{event:'*',schema:'public',table:'records'},p=>{
    const r=p.eventType==='DELETE'?p.old:p.new;if(!r||!r.kind)return;
    const k=r.kind+SEP+r.id;
    if(p.eventType==='DELETE'){if(!SNAP.has(k))return;SNAP.delete(k);applyRec(S,r.kind,r.id,null)}
    else{const v=canon(r.data);if(SNAP.get(k)===v)return;SNAP.set(k,v);applyRec(S,r.kind,r.id,r.data)}
    reindex();renderSoon();
  }).subscribe();
  sb.channel('profiles').on('postgres_changes',{event:'*',schema:'public',table:'profiles'},()=>{loadProfiles().then(()=>{renderNav();if(UI.tab==='settings')renderSoon()})}).subscribe();
}

const BUCKET='documents';
function docsFor(e,l){return (S.docs||[]).filter(d=>d.e===e&&(!l||d.leave===l)).sort((a,b)=>b.at.localeCompare(a.at))}
function leaveLabel(lid){const r=(S.leave||[]).find(x=>x.id===lid);return r?ltype(r.t).name+' '+fmtD(r.from):'leave'}
function docsBlock(e,l,title){return `<div class="docs" data-docs-e="${e}" data-docs-l="${l||''}"><div class="row"><b>📎 ${title||'Documents'}</b><span class="sp"></span><label class="btn sm">+ Attach PDF / photo<input type="file" accept="application/pdf,image/*" data-act="docup" hidden multiple></label></div><div class="doclist">${docList(e,l)}</div></div>`}
function docList(e,l){const ds=docsFor(e,l);return ds.length?ds.map(d=>`<div class="docrow"><span>${d.type.startsWith('image')?'🖼':'📄'}</span><a href="#" data-act="docopen" data-v="${d.id}">${esc(d.name)}</a><span class="muted" style="font-size:11px">${fmtD(d.at.slice(0,10))} ${d.at.slice(0,4)} · ${Math.max(1,Math.round(d.size/1024))} KB${!l&&d.leave?' · '+esc(leaveLabel(d.leave)):''}${d.by?' · '+esc(d.by):''}</span><span class="sp"></span><button class="btn sm ghost" data-act="docdel" data-v="${d.id}" title="Delete">✕</button></div>`).join(''):'<div class="muted" style="font-size:12px;margin-top:6px">No documents yet.</div>'}
function refreshDocBox(box){box.querySelector('.doclist').innerHTML=docList(box.dataset.docsE,box.dataset.docsL)}
async function uploadDocs(input){
  const box=input.closest('[data-docs-e]'),sel=box.closest('.modal')?.querySelector('#lve');
  if(sel)box.dataset.docsE=sel.value;
  const e=box.dataset.docsE,l=box.dataset.docsL||null;
  for(const f of [...input.files]){
    if(f.size>10*1024*1024){toast(f.name+' is bigger than 10 MB');continue}
    if(!/^(application\/pdf|image\/)/.test(f.type)){toast('Only PDF or image files');continue}
    const id=uid(),safe=f.name.replace(/[^\w.\-]+/g,'_').slice(-80),path=`${e}/${id}-${safe}`;
    box.querySelector('.doclist').insertAdjacentHTML('afterbegin',`<div class="muted" style="font-size:12px">Uploading ${esc(f.name)}…</div>`);
    const{error}=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type,upsert:false});
    if(error){toast('Upload failed: '+error.message);continue}
    S.docs.push({id,e,leave:l,path,name:f.name,type:f.type,size:f.size,at:new Date().toISOString(),by:ME?.name||ME?.email||''});save();
  }
  refreshDocBox(box);input.value='';
  const c=box.closest('.modal')?.querySelector('#lvc');if(c&&docsFor(e,l).length)c.checked=true;
}

function reindex(){
  IDX={byED:new Map(),emp:new Map(),job:new Map()};
  for(const e of S.emps)IDX.emp.set(e.id,e);
  for(const j of S.jobs)IDX.job.set(j.id,j);
  for(const en of S.entries){const k=en.e+'|'+en.d;if(!IDX.byED.has(k))IDX.byED.set(k,[]);IDX.byED.get(k).push(en)}
  if(!S.leave)S.leave=[];if(!S.docs)S.docs=[];leaveIndex();
}
const cellEntries=(e,d)=>IDX.byED.get(e+'|'+d)||[];
const cellHours=(e,d)=>cellEntries(e,d).reduce((a,x)=>a+(+x.h||0),0);
const emp=id=>IDX.emp.get(id)||{name:'?',nick:'?',color:'#888',rate:0};
const job=id=>IDX.job.get(id)||{name:'(deleted job)',code:'—',color:'#666'};
const nm=e=>e.nick||e.name;
const avatar=e=>`<div class="av" style="background:${e.color}">${esc(initials(nm(e)))}</div>`;
const activeEmps=()=>S.emps.filter(e=>e.active).sort((a,b)=>nm(a).localeCompare(nm(b)));
function empsForRange(a,b){
  const ids=new Set();
  for(const en of S.entries)if(en.d>=a&&en.d<=b)ids.add(en.e);
  for(const k in S.notes){const[e,d]=k.split('|');if(d>=a&&d<=b)ids.add(e)}
  return S.emps.filter(e=>ids.has(e.id)||(e.active&&(!e.start||e.start<=b))).sort((x,y)=>nm(x).localeCompare(nm(y)));
}
const openJobs=()=>S.jobs.filter(j=>j.status==='active');
function roundH(mins){const r=+S.settings.round||1;return Math.round(mins/r)*r/60}
function workedMinutes(d,a,b){ // a,b "HH:MM"; subtract lunch overlap
  let m=toMin(b)-toMin(a); if(m<0)m=0;
  const lf=toMin(S.settings.lunchFrom||'00:00'),lt=toMin(S.settings.lunchTo||'00:00');
  const ov=Math.max(0,Math.min(toMin(b),lt)-Math.max(toMin(a),lf));
  return m-ov;
}
const money_on=()=>!UI.locked;

/* ---------- clock actions ---------- */
function clockIn(e,j){
  const d=todayISO(),t=nowHM();
  S.clocks[e]={j,d,t};
  const k=e+'|'+d;
  // auto-late flag on first clock-in of the day
  if(!cellEntries(e,d).length&&!S.notes[k]&&toMin(t)>toMin(S.settings.dayStart)+(+S.settings.grace||0))
    S.notes[k]={c:'late',t:'Clocked in '+t};
  if(S.notes[k]&&CODES[S.notes[k].c]?.off)delete S.notes[k];
  save();
}
function clockOut(e,endT){
  const c=S.clocks[e];if(!c)return;
  let t=endT||(c.d===todayISO()?nowHM():S.settings.dayEnd);
  const mins=workedMinutes(c.d,c.t,t);
  const h=roundH(mins);
  if(h>0)S.entries.push({id:uid(),e,d:c.d,j:c.j,h,r:emp(e).rate,a:c.t,b:t,src:'clock'});
  delete S.clocks[e];save();
  return h;
}

/* ---------- TODAY ---------- */
function statusOf(e,d){
  const c=S.clocks[e.id];
  const note=S.notes[e.id+'|'+d];
  const h=cellHours(e.id,d);
  if(c)return{k:'in',c,h,note};
  const lv=leaveOn(e.id,d);if(lv&&!h)return{k:'abs',h,note:{c:'leave',t:ltype(lv.t).name,lv:1}};
  if(holidayName(d)&&!h)return{k:'abs',h,note:{c:'holiday',t:holidayName(d),lv:1}};
  if(note&&CODES[note.c]?.off)return{k:'abs',h,note};
  if(h>0)return{k:'done',h,note};
  return{k:'out',h,note};
}

function tileHTML(e,s){
  let mid='',pill='';
  if(s.k==='in'){const j=job(s.c.j);pill='<span class="pill p-in">On site</span>';mid=`<span class="jobchip"><span class="dot" style="background:${j.color}"></span>${esc(j.code)} · ${esc(j.name)}</span><div class="timer" data-since="${s.c.d} ${s.c.t}" data-base="${s.h}">0h 00m</div>`}
  else if(s.k==='abs'){pill=`<span class="pill p-abs">${esc(s.note.lv?s.note.t:CODES[s.note.c].l)}</span>`;mid=s.note.lv?'':`<small class="muted">${esc(s.note.t||'')}</small>`}
  else if(s.k==='done'){pill='<span class="pill p-done">Logged</span>';mid=jobsMini(e.id,todayISO())}

    ${mid}

function jobsMini(e,d){

}
function todayJobsHTML(d){

function tick(){

function weekJobSummary(days){
  const by={};for(const en of S.entries)if(en.d>=days[0]&&en.d<=days[6])by[en.j]=(by[en.j]||0)+ +en.h;

}
function setCellHours(e,d,val){
  const ents=cellEntries(e,d);
  const h=parseFloat(String(val).replace(',','.'));
  if(val===''||isNaN(h)||h===0){S.entries=S.entries.filter(x=>!(x.e===e&&x.d===d));save();return true}
  const jobs=new Set(ents.map(x=>x.j));
  if(jobs.size>1)return false;
  const j=ents[0]?.j||S.settings.defJob;
  S.entries=S.entries.filter(x=>!(x.e===e&&x.d===d));
  S.entries.push({id:uid(),e,d,j,h,r:ents[0]?.r??emp(e).rate,src:'manual'});
  const k=e+'|'+d;if(S.notes[k]&&CODES[S.notes[k].c]?.off)delete S.notes[k];
  save();return true;
}

function jobStats(){
  const st={};for(const j of S.jobs)st[j.id]={h:0,cost:0,people:new Set(),last:''};
  for(const en of S.entries){const s=st[en.j];if(!s)continue;s.h+= +en.h;s.cost+=en.h*(en.r??emp(en.e).rate);s.people.add(en.e);if(en.d>s.last)s.last=en.d}
  for(const [e,c] of Object.entries(S.clocks)){const s=st[c.j];if(s&&c.d===todayISO()){s.live=(s.live||0)+1}}
  return st;
}

function attStats(e,a,b){
  let h=0,present=0,sched=0,absent=0,late=0,wage=0;const E=emp(e);
  for(let d=a;d<=b;d=addDays(d,1)){
    if(E.start&&d<E.start)continue;if(E.end&&d>E.end)break;
    const hh=cellHours(e,d),n=S.notes[e+'|'+d];
    const isWork=(+S.settings.std[dow(d)]||0)>0&&!(n&&n.c==='holiday')&&!holidayName(d)&&!leaveOn(e,d);
    if(isWork)sched++;
    if(hh>0){present++;h+=hh;wage+=cellEntries(e,d).reduce((x,y)=>x+y.h*(y.r??E.rate),0)}
    if(n&&CODES[n.c]?.off&&n.c!=='holiday'&&n.c!=='rain'&&!leaveOn(e,d))absent++;
    if(n&&(n.c==='late'||n.c==='early'))late++;
  }
  if(present>sched)present=sched;
  return{h,present,sched,absent,late,wage};
}

const PR_CSS='<style>.pr{font-family:Arial,Helvetica,sans-serif;color:#111;padding:8mm}.pr h2{margin:0 0 2px}.pr h3{margin:16px 0 6px;font-size:14px}.pr p{margin:0 0 10px;color:#444}.pr table{width:100%;border-collapse:collapse;margin-bottom:8px}.pr th,.pr td{border:1px solid #999;padding:4px 6px;font-size:11px;text-align:left;color:#111;background:#fff;position:static;text-transform:none;letter-spacing:0}.pr th{background:#eee!important}.pr .n{text-align:right;white-space:nowrap}.pr tr.tot td{font-weight:bold;background:#f4f4f4}.pr tr:hover td{background:#fff}.pr tr.tot:hover td{background:#f4f4f4}.pr .kp td{font-size:12px}.pr small{color:#555}@page{margin:10mm}</style>';

function reportData(){

  ents.forEach(x=>{byJ[x.j]=(byJ[x.j]||0)+ +x.h;byJC[x.j]=(byJC[x.j]||0)+x.h*(x.r??emp(x.e).rate);byD[x.d]=(byD[x.d]||0)+ +x.h});
  let sched=0,pres=0,abs=0,late=0;

function payRows(ws){
  const days=weekDays(ws),we=days[6];
  return empsForRange(ws,we).map(e=>{
    const ents=S.entries.filter(x=>x.e===e.id&&x.d>=ws&&x.d<=we);
    const h=ents.reduce((a,x)=>a+ +x.h,0);
    const byR={};ents.forEach(x=>{const r=x.r??e.rate;byR[r]=(byR[r]||0)+ +x.h});
    const gross=ents.reduce((a,x)=>a+x.h*(x.r??e.rate),0);
    const adv=S.adv.filter(x=>x.e===e.id&&x.d>=ws&&x.d<=we);
    const advT=adv.reduce((a,x)=>a+x.amt,0);

function leavePay(e,ws,we){ // paid leave in pay week -> [{label,h,rate}]
  const out={};
  for(let d=ws;d<=we;d=addDays(d,1)){
    const r=leaveOn(e.id,d);if(!r)continue;const t=ltype(r.t);if(!t.paid||cellHours(e.id,d)>0)continue;
    const wd=workdaysBetween(r.from,r.to||r.from)||1,frac=Math.min(1,(+r.days||0)/wd);
    const h=(+S.settings.std[dow(d)]||0)*frac;if(!h)continue;
    out[t.id]=out[t.id]||{label:t.name,h:0,days:0,rate:e.rate};out[t.id].h+=h;out[t.id].days+=frac;
  }
  return Object.values(out);
}

/* ---------- CSV ---------- */
function dl(name,text,type='text/csv'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
const csv=rows=>'﻿'+rows.map(r=>r.map(v=>{v=String(v??'');return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n');
function entriesCSV(a,b){
  const rows=[['Date','Day','Pay week','Emp no','Name','Job no','Job','Client','Hours','Rate','Amount','Start','End','Mark','Note']];
  S.entries.filter(x=>(!a||x.d>=a)&&(!b||x.d<=b)).sort((x,y)=>x.d.localeCompare(y.d)).forEach(x=>{const e=emp(x.e),j=job(x.j),n=S.notes[x.e+'|'+x.d];const r=x.r??e.rate;
    rows.push([x.d,DOW[dow(x.d)],weekNo(weekStart(x.d)),e.no,e.name,j.code,j.name,j.client,x.h,r,(x.h*r).toFixed(2),x.a||'',x.b||'',n?CODES[n.c]?.l:'',n?.t||''])});
  return csv(rows);
}

/* ---------- modal ---------- */
function modal(html,onMount,cls=''){
  closeModal();
  const s=document.createElement('div');s.className='scrim';s.id='scrim';
  s.innerHTML=`<div class="modal ${cls}">${html}</div>`;
  s.addEventListener('mousedown',ev=>{if(ev.target===s)closeModal()});
  document.body.appendChild(s);
  const m=s.firstElementChild;onMount&&onMount(m);
  const f=m.querySelector('input[type=text],input[type=number]');if(f&&!('ontouchstart' in window))f.focus();
}
function closeModal(){$('#scrim')?.remove();if(pendingRender){pendingRender=false;render()}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

      emps.forEach(e=>{let tw=0;const hs=days.map(d=>{const en=cellEntries(e.id,d);tw+=en.reduce((a,x)=>a+x.h*(x.r??e.rate),0);const h=en.reduce((a,x)=>a+ +x.h,0);const n=S.notes[e.id+'|'+d];return (h||'')+(n?' ('+(CODES[n.c]?.l||'')+(n.t?': '+n.t:'')+')':'')});
        rows.push([e.no,e.name,...hs,days.reduce((a,d)=>a+cellHours(e.id,d),0),e.rate,tw.toFixed(2)])});
      rows.push([]);rows.push(['Entries per job']);rows.push(['Date','Name','Job','Hours']);
      S.entries.filter(x=>x.d>=ws&&x.d<=days[6]).forEach(x=>rows.push([x.d,emp(x.e).name,job(x.j).code+' '+job(x.j).name,x.h]));
      dl(`register-week-${weekNo(ws)}-${ws.slice(0,4)}.csv`,csv(rows));break}
    case 'printweek':{const ws=UI.week,days=weekDays(ws),emps=regEmps(ws),M=money_on();let gT=0,dT=days.map(()=>0);
      const body=`<table><tr><th>No</th><th>Name</th>${days.map(d=>`<th class="n">${DOW[dow(d)]}<br>${fmtD(d)}${holidayName(d)?'<br><small>PH</small>':''}</th>`).join('')}<th class="n">Total hrs</th>${M?'<th class="n">Rate</th><th class="n">Wages</th>':''}</tr>${emps.map(e=>{let w=0;const hs=days.map((d,i)=>{const en=cellEntries(e.id,d),h=en.reduce((a,x)=>a+ +x.h,0);w+=en.reduce((a,x)=>a+x.h*(x.r??e.rate),0);dT[i]+=h;const n=S.notes[e.id+'|'+d],lv=leaveOn(e.id,d);return `<td class="n">${h?h2(h):''}${lv&&!h?'<small>'+esc(ltype(lv.t).name.split(' ')[0])+'</small>':''}${n?' <small>'+esc(CODES[n.c]?.l||'')+'</small>':''}</td>`}).join('');const th=days.reduce((a,d)=>a+cellHours(e.id,d),0);gT+=w;return `<tr><td>${e.no??''}</td><td>${esc(e.name)}</td>${hs}<td class="n"><b>${h2(th)}</b></td>${M?`<td class="n">${money(e.rate)}</td><td class="n"><b>${money(w)}</b></td>`:''}</tr>`}).join('')}<tr class="tot"><td colspan="2">Total</td>${dT.map(h=>`<td class="n">${h?h2(h):''}</td>`).join('')}<td class="n">${h2(dT.reduce((a,b)=>a+b,0))}</td>${M?`<td></td><td class="n">${money(gT)}</td>`:''}</tr></table>`;
      doPrint(prDoc('Aanwesigheid register',`Week ${weekNo(ws)}: ${fmtDL(ws)} – ${fmtDL(days[6])}`,body));break}
    case 'regsort':try{localStorage.setItem('dagregister.regSort',v)}catch(e){}render();break;
    case 'printrep':printReport(v);break;
    case 'jobf':UI.jobFilter=v;render();break;
    case 'job':jobModal(v);break;
    case 'newjob':jobModal('');break;
    case 'savejob':{const m=t.closest('.modal'),g=s=>m.querySelector(s).value.trim();
      const d={code:g('#jc')||nextCode(),name:g('#jn')||'Untitled job',client:g('#jcl'),quote:+g('#jq')||0,color:g('#jcol'),notes:g('#jno')};
      if(v)Object.assign(job(v),d);else S.jobs.push({id:uid(),status:'active',...d});save();closeModal();render();break}
    case 'togglejob':{const j=job(v);j.status=j.status==='active'?'done':'active';save();closeModal();render();break}
    case 'deljob':if(confirm('Delete this job?')){S.jobs=S.jobs.filter(j=>j.id!==v);save();closeModal();render()}break;
    case 'pf':UI.peopleFilter=v;render();break;
    case 'emp':empModal(v);break;
    case 'newemp':empModal('');break;
    case 'saveemp':{const m=t.closest('.modal'),g=s=>m.querySelector(s).value.trim();
      const d={no:+g('#pno')||null,name:g('#pn')||'New person',nick:g('#pk'),role:g('#pr'),type:g('#pt'),rate:+g('#prt')||0,start:g('#ps'),end:g('#pe'),color:g('#pc'),endNote:g('#pnote'),active:m.querySelector('#pa').checked};
      if(v)Object.assign(emp(v),d);else S.emps.push({id:'e'+uid(),...d});save();closeModal();render();break}
    case 'delemp':if(confirm('Delete this person?')){S.emps=S.emps.filter(e=>e.id!==v);save();closeModal();render()}break;
    case 'range':UI.range=v;render();break;
    case 'csvrange':{const[a,b]=rangeOf();dl(`time-entries_${a}_to_${b}.csv`,entriesCSV(a,b));break}
    case 'csvall':dl('time-entries-all.csv',entriesCSV());break;
    case 'pw':UI.payWeek=v==='0'?weekStart(todayISO()):addDays(UI.payWeek,7*+v);render();break;
    case 'print1':{const r=payRows(UI.payWeek).find(r=>r.e.id===v);doPrint(slipHTML(r,UI.payWeek));break}
    case 'printall':{const rs=payRows(UI.payWeek);if(!rs.length)return toast('Nothing to print');doPrint(rs.map(r=>slipHTML(r,UI.payWeek)).join(''));break}
    case 'backup':dl(`dagregister-backup-${todayISO()}.json`,JSON.stringify(S),'application/json');break;
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.filter==='jp'){const q=t.value.toLowerCase();document.querySelectorAll('#jp .jobbtn').forEach(b=>b.style.display=b.dataset.s.includes(q)?'':'none')}
  if(t.dataset.l==='h')updLnTot(t.closest('.modal'));
  if(['lve','lvt','lvf','lvto','lvd'].includes(t.id)){const m=t.closest('.modal');if(t.id==='lvd')m._auto=false;if(t.id==='lvf'||t.id==='lvto')m._auto=true;updLeaveInfo(m)}
  if(t.dataset.act==='jobq'){UI.jobQ=t.value;const p=t.selectionStart;render();const n=document.querySelector('[data-act=jobq]');n.focus();n.setSelectionRange(p,p)}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.cell){const[e,d]=t.dataset.cell.split('|');if(!setCellHours(e,d,t.value.trim())){cellModal(e,d);toast('Split over several jobs – edit lines here')}else render();return}
  if(t.dataset.act==='wkpick'&&t.value){UI.week=weekStart(t.value);render()}
  if(t.dataset.act==='from'){UI.from=t.value;render()}
  if(t.dataset.act==='to'){UI.to=t.value;render()}
  if(t.dataset.set){S.settings[t.dataset.set]=t.value;save();renderNav();toast('Saved')}
  if(t.dataset.std){S.settings.std[t.dataset.std]=+t.value||0;save();toast('Saved')}
  if(t.dataset.ded){const k=t.dataset.ded;S.deds[k]=S.deds[k]||{amt:0,label:''};S.deds[k][t.dataset.k]=t.dataset.k==='amt'?(+t.value||0):t.value;save();render()}
  if(t.dataset.act==='docup'&&t.files.length){uploadDocs(t);return}
  if((t.dataset.act==='restore'||t.dataset.act==='import')&&t.files[0]){const r=new FileReader();r.onload=async()=>{try{const d=stateFromFile(JSON.parse(r.result));if(t.dataset.act==='restore'&&!confirm('Restore this backup for EVERYONE? It replaces all current data.'))return;S=d;reindex();const m=$('#impMsg');if(m)m.textContent='Uploading '+S.entries.length+' entries…';clearTimeout(save.t);await flush();render();toast('Data loaded')}catch(e){toast(e.message||'Not a valid file')}};r.readAsText(t.files[0])}
  if(t.dataset.role){(async()=>{const{error}=await sb.from('profiles').update({role:t.value}).eq('id',t.dataset.role);toast(error?error.message:'Access updated');await loadProfiles();render()})()}
});
// keyboard nav in register: Enter / arrows move between cells
document.addEventListener('keydown',ev=>{
  const t=ev.target;if(!t.dataset||!t.dataset.cell)return;
  const all=[...document.querySelectorAll('[data-cell]')],i=all.indexOf(t),cols=7;
  let n=null;
  if(ev.key==='Enter'||ev.key==='ArrowDown')n=all[i+cols];
  else if(ev.key==='ArrowUp')n=all[i-cols];
  else if(ev.key==='ArrowRight'&&t.selectionStart===t.value.length)n=all[i+1];
  else if(ev.key==='ArrowLeft'&&t.selectionStart===0)n=all[i-1];
  if(n){ev.preventDefault();const key=n.dataset.cell;t.blur();setTimeout(()=>{const m=document.querySelector(`[data-cell="${key}"]`);m&&(m.focus(),m.select())},0)}
});

try{document.documentElement.dataset.theme=localStorage.getItem('dagregister.theme')==='light'?'light':'dark'}catch(e){}
shell(false);afterLogin();
</script>
